<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MXGJGT 后台</title>
<link rel="icon" id="favicon">
<style>
  :root{
    --brand:#a855f7; --brand2:#8b5cf6; --deep:#6366f1; --ok:#16a34a; --err:#e5484d;
    --ink:#3f3563; --sub:#8b85a1; --line:#eee9f8;
    --grad:linear-gradient(120deg,#f02fc2 0%,#a855f7 48%,#6366f1 100%);
    --radius:20px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--grad);background-attachment:fixed;min-height:100vh}
  a{color:var(--brand)}
  .hide{display:none !important}
  svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ===== 通用按钮 ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;
    padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;transition:.15s;text-decoration:none;font-family:inherit}
  .btn.primary{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:#f3effb;color:#5b5378}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn.danger{background:#fdecec;color:var(--err)}

  /* ===== 登录 ===== */
  #login-view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--grad);padding:16px}
  .login-card{width:min(400px,92vw);background:rgba(255,255,255,.97);border-radius:24px;padding:34px 30px 28px;
    box-shadow:0 30px 80px rgba(76,29,149,.38);text-align:center;backdrop-filter:blur(10px)}
  .login-card img{width:190px;max-width:70%;margin:0 auto 14px;display:block}
  .login-card h1{font-size:18px;margin:0 0 4px}
  .login-card p.sub{color:var(--sub);font-size:13px;margin:0 0 22px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;outline:none;transition:.15s;font-family:inherit;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
  .btn.primary.block{width:100%}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}

  /* ===== 后台外壳 ===== */
  .wrap{display:flex;gap:18px;padding:18px;max-width:1240px;margin:0 auto;min-height:100vh}
  .sidebar{width:208px;flex:none;background:#fff;border-radius:24px;padding:22px 14px 14px;
    display:flex;flex-direction:column;box-shadow:0 18px 44px rgba(76,29,149,.20);transition:width .2s}
  .brand{display:flex;flex-direction:column;align-items:center;gap:9px;padding:2px 0 20px}
  .badge{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#fde9ff,#ece4ff);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(168,85,247,.28)}
  .badge img{width:40px;height:40px;display:block}
  .bname{font-size:11px;letter-spacing:2.5px;font-weight:800;color:var(--brand)}
  .menu{display:flex;flex-direction:column;gap:6px}
  .menu button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#6d6588;
    font-size:14px;padding:11px 14px;border-radius:13px;cursor:pointer;text-align:left;font-family:inherit;transition:.16s;white-space:nowrap}
  .menu button .ic{width:18px;height:18px;flex:none}
  .menu button:hover{background:#f5f1ff;color:var(--brand)}
  .menu button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 22px rgba(139,92,246,.38)}
  .burger{margin-top:auto;border:0;background:transparent;color:#b8b2c9;cursor:pointer;padding:9px;border-radius:11px;
    display:flex;align-items:center;justify-content:center}
  .burger:hover{background:#f5f1ff;color:var(--brand)}
  .sidebar.mini{width:76px}
  .sidebar.mini .bname,.sidebar.mini .menu button span{display:none}
  .sidebar.mini .menu button{justify-content:center;padding:12px}
  .sidebar.mini .brand{padding-bottom:14px}

  .main{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:12px;padding:2px 2px 0}
  .greet{flex:1;min-width:0}
  .greet .hi{font-size:12px;color:rgba(255,255,255,.85)}
  .greet .who{font-size:20px;font-weight:700;color:#fff;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tsearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border-radius:999px;padding:9px 16px;width:min(250px,34vw)}
  .tsearch svg{width:16px;height:16px;stroke:#a9a3bd;flex:none}
  .tsearch input{border:0;background:transparent;outline:none;font-size:13px;color:var(--ink);width:100%;font-family:inherit}
  .tsearch input::placeholder{color:#aaa4be}
  .icob{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#4b3f72;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:15px;font-weight:800;flex:none}
  .icob:hover{background:#fff}
  .icob svg{width:18px;height:18px}
  .icob .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid #fff}
  .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--deep));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;border:2px solid rgba(255,255,255,.9);flex:none}

  .content{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}

  /* 首页 */
  .home{display:flex;flex-direction:column;gap:16px;flex:1}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .stat{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.42);border-radius:18px;padding:18px;
    color:#fff;backdrop-filter:blur(6px);min-height:106px;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .stat .num{font-size:26px;font-weight:800;line-height:1.1}
  .stat .lbl{font-size:13px;color:rgba(255,255,255,.86)}
  .home2{display:grid;grid-template-columns:2.1fr 1fr;gap:16px;flex:1;min-height:300px}
  .hcard{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.42);border-radius:18px;padding:22px;
    color:#fff;backdrop-filter:blur(6px);display:flex;flex-direction:column}
  .hcard h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .hcard .sub2{font-size:12px;color:rgba(255,255,255,.82);margin-bottom:16px}
  .quick{display:flex;flex-wrap:wrap;gap:10px}
  .qbtn{border:0;cursor:pointer;background:rgba(255,255,255,.9);color:#7c3aed;font-weight:700;font-size:13px;
    padding:11px 16px;border-radius:12px;font-family:inherit}
  .qbtn:hover{background:#fff}
  .hcard .center{flex:1;display:flex;align-items:center;justify-content:center;font-size:19px;color:rgba(255,255,255,.92)}
  .kv2{display:flex;flex-direction:column;gap:12px;font-size:13px}
  .kv2 div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(255,255,255,.3);padding-bottom:10px}
  .kv2 div:last-child{border-bottom:0}
  .kv2 b{color:rgba(255,255,255,.78);font-weight:600}

  /* 内容面板（白卡） */
  .card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:0 14px 34px rgba(76,29,149,.12)}
  .card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .card h2 .spacer{flex:1}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--sub);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:0}
  .ops{display:flex;gap:6px;flex-wrap:wrap}
  code.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#4b5563;background:#f5f3fb;padding:2px 6px;border-radius:6px;word-break:break-all}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px}
  .pill.on{background:#e7f7ed;color:var(--ok)}
  .pill.off{background:#f1f2f5;color:var(--sub)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row .field{margin-bottom:0;flex:1 1 180px}
  .maprow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .maprow:last-child{border-bottom:0}
  .maprow .off{font-weight:700;min-width:96px;padding-top:6px}
  .checks{display:flex;gap:12px;flex-wrap:wrap;flex:1}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13px;background:#f6f3fd;padding:6px 10px;border-radius:9px;cursor:pointer}
  .empty{color:var(--sub);font-size:14px;padding:14px 0}
  .kv{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
  .kv div b{color:var(--sub);font-weight:600;margin-right:6px}

  /* 详情弹窗内嵌播放 */
  .player{background:#0b0e17;border-radius:11px;overflow:hidden;margin-bottom:14px}
  .player video{width:100%;max-height:340px;display:block;background:#000}
  .player .pbar{display:flex;align-items:center;gap:10px;padding:8px 10px;color:#c7ccda;font-size:12px}
  .player .pbar .spacer{flex:1}
  .player .pbar .btn{padding:5px 10px;font-size:12px}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(40,20,80,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:18px;width:min(560px,96vw);max-height:90vh;overflow:auto;padding:22px}
  .modal.wide{width:min(920px,96vw)}
  .modal h3{margin:0 0 16px;font-size:16px;display:flex;align-items:center;gap:8px}
  .modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal .grid .field.full{grid-column:1/-1}
  .modal footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .modal textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
  .modal .field select{width:100%}

  /* 提示 */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#2a1e4d;color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;opacity:0;
    pointer-events:none;transition:.25s;z-index:99;max-width:88vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:960px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .home2{grid-template-columns:1fr}
    .wrap{flex-direction:column;padding:12px;gap:12px}
    .sidebar{width:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow:auto}
    .brand{flex-direction:row;padding:0 6px 0 0}
    .menu{flex-direction:row;gap:4px}
    .menu button{white-space:nowrap}
    .burger{margin-top:0;margin-left:auto}
    .modal .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="login-view">
  <form class="login-card" id="login-form" autocomplete="off">
    <img id="logo-login" alt="MXGJGT">
    <h1>MXGJGT 后台管理</h1>
    <p class="sub">登录后可管理资源站 / 平台映射 / 系统更新</p>
    <div class="field">
      <label>用户名</label>
      <input id="username" name="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn primary block" type="submit">登 录</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<!-- ===== 后台主页 ===== -->
<div id="app-view" class="hide">
  <div class="wrap">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="badge"><img id="logo-mark" alt="MXGJGT"></div>
        <div class="bname">MXGJGT</div>
      </div>
      <nav class="menu">
        <button data-tab="home" class="on">
          <svg class="i ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V20h13V9.3"/><path d="M10 20v-5h4v5"/></svg>
          <span>首页</span>
        </button>
        <button data-tab="sites">
          <svg class="i ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
          <span>资源站管理</span>
        </button>
        <button data-tab="maps">
          <svg class="i ic" viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M10.6 6.6l1.7-1.7a3.6 3.6 0 0 1 5.1 5.1l-1.7 1.7"/><path d="M13.4 17.4l-1.7 1.7a3.6 3.6 0 0 1-5.1-5.1l1.7-1.7"/></svg>
          <span>平台映射</span>
        </button>
        <button data-tab="sys">
          <svg class="i ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
          <span>系统 · 更新</span>
        </button>
      </nav>
      <button class="burger" id="btn-burger" title="收起 / 展开">
        <svg class="i" viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </aside>

    <!-- 主区 -->
    <div class="main">
      <!-- 顶栏 -->
      <div class="topbar">
        <div class="greet">
          <div class="hi" id="g-hi">你好，</div>
          <div class="who" id="g-who">管理员</div>
        </div>
        <div class="tsearch">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="global-wd" placeholder="关键词搜索">
        </div>
        <button class="icob" id="btn-help" title="帮助">?</button>
        <button class="icob" id="btn-bell" title="通知">
          <svg class="i" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.6 5.6 1.6 5.6H4.4S6 13.5 6 9z"/><path d="M9.6 18.4a2.6 2.6 0 0 0 4.8 0"/></svg>
          <i class="dot"></i>
        </button>
        <div class="avatar" id="btn-avatar" title="账号">M</div>
      </div>

      <!-- 内容 -->
      <div class="content">
        <!-- 首页 / 概览 -->
        <section id="tab-home" class="home">
          <div class="stats">
            <div class="stat"><div class="num" id="st-sites">0</div><div class="lbl">资源站总数</div></div>
            <div class="stat"><div class="num" id="st-enabled">0</div><div class="lbl">已启用资源站</div></div>
            <div class="stat"><div class="num" id="st-maps">0</div><div class="lbl">平台映射</div></div>
            <div class="stat"><div class="num" id="st-ver">-</div><div class="lbl">当前版本</div></div>
          </div>
          <div class="home2">
            <div class="hcard">
              <h3>快速操作</h3>
              <div class="sub2">常用入口，一键直达</div>
              <div class="quick">
                <button class="qbtn" id="q-add">＋ 新增资源站</button>
                <button class="qbtn" id="q-auto">苹果CMS 自动分析</button>
                <button class="qbtn" id="q-search">搜索资源</button>
                <button class="qbtn" id="q-check">检查更新</button>
                <button class="qbtn" id="q-reload">重载配置</button>
              </div>
              <div class="center" id="home-hint">内容区</div>
            </div>
            <div class="hcard">
              <h3>系统状态</h3>
              <div class="sub2">当前运行信息</div>
              <div class="kv2" id="home-sys"></div>
            </div>
          </div>
        </section>

        <!-- 资源站 -->
        <section id="tab-sites" class="card hide">
          <h2>资源站列表 <span class="spacer"></span>
            <button class="btn ghost sm" id="btn-refresh-sites">刷新</button>
            <button class="btn ghost sm" id="btn-auto">苹果CMS 自动分析</button>
            <button class="btn primary sm" id="btn-add-site">新增资源站</button>
          </h2>
          <div id="sites-box"></div>
        </section>

        <!-- 映射 -->
        <section id="tab-maps" class="card hide">
          <h2>官方平台 → 资源站 优先映射 <span class="spacer"></span>
            <button class="btn ghost sm" id="btn-refresh-maps">刷新</button>
          </h2>
          <p class="empty">勾选该官方平台优先使用的资源站（可多选，按需保存）。</p>
          <div id="maps-box"></div>
        </section>

        <!-- 系统 -->
        <section id="tab-sys" class="card hide">
          <h2>系统信息 <span class="spacer"></span>
            <button class="btn ghost sm" id="btn-check">检查更新</button>
          </h2>
          <div class="kv" id="sys-info"></div>
          <div style="margin-top:18px" class="row">
            <button class="btn ghost" id="btn-reload">重载配置</button>
            <button class="btn primary" id="btn-update">立即更新</button>
          </div>
          <p class="empty" id="update-msg"></p>
        </section>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script>
(function () {
  "use strict";
  // 后台入口路径（如 /mx），据此拼接口
  var BASE = location.pathname.replace(/\/+$/, "");
  if (!BASE) BASE = "/mx";
  var API = BASE + "/api";

  // logo / favicon / 侧边栏徽标 均由服务端自托管（内嵌二进制），不依赖外部图床
  document.getElementById("favicon").setAttribute("href", BASE + "/assets/favicon.png");
  ["logo-login", "logo-mark"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.setAttribute("src", BASE + "/assets/" + (id === "logo-mark" ? "logo-mark.png" : "logo.png"));
  });

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  var toastTimer;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  // 统一请求：cookie 同源携带
  function api(path, opt) {
    opt = opt || {};
    var conf = { method: opt.method || "GET", credentials: "same-origin", headers: {} };
    if (opt.body !== undefined) {
      conf.headers["Content-Type"] = "application/json";
      conf.body = JSON.stringify(opt.body);
    }
    return fetch(path, conf).then(function (r) {
      if (r.status === 401) { showLogin(); throw new Error("未登录"); }
      return r.json();
    });
  }

  // ===== 视图切换 =====
  function showLogin() {
    $("#login-view").classList.remove("hide");
    $("#app-view").classList.add("hide");
  }

  // 运行时版本信息：当前版本来自服务端，远程版本由「检查更新」填充
  var verData = {}, remoteVer = "未检查";
  var allSites = [], allMaps = [];

  function renderSys() {
    var d = verData;
    var rv = remoteVer;
    if (d.remote_checked && d.remote_error) rv = "检查失败";
    $("#sys-info").innerHTML =
      '<div><b>当前版本</b>v' + esc(d.version || "?") + "</div>" +
      '<div><b>远程版本</b>' + esc(rv) + "</div>" +
      '<div><b>构建时间</b>' + esc(d.build || "-") + "</div>" +
      '<div><b>更新仓库</b>' + esc(d.repo_url || "-") + "</div>" +
      '<div><b>定时更新</b>' + (d.updater ? "已开启" : "已关闭") + "</div>";
    // 首页系统状态
    $("#home-sys").innerHTML =

  // 搜索：在该资源站内搜索关键词，列出结果供人工核对；每条结果可点「详情」看剧集并播放
  function openSearchModal(site, wd) {
    $("#modal-root").innerHTML =
      '<div class="mask"><div class="modal"><h3>搜索资源站：' + esc(site.name) + "</h3>" +
      '<div class="field"><label>关键词</label><input id="s-wd" placeholder="输入剧名，如：狂飙"></div>' +

      '<div id="s-result" style="margin-top:16px"></div></div></div>';

    function doSearch() {
      var kw = $("#s-wd").value.trim();
      if (!kw) { toast("请输入关键词"); return; }
      $("#s-result").innerHTML = '<p class="empty">搜索中...</p>';

          });

  // 全局搜索：在已启用的资源站中并发搜索，汇总结果
  function globalSearch(kw) {
    if (!kw) { toast("请输入关键词"); return; }
    var sites = allSites.filter(function (s) { return s.enabled; });
    if (!sites.length) { toast("暂无已启用的资源站"); return; }
    sites = sites.slice(0, 8);
    $("#modal-root").innerHTML =
      '<div class="mask"><div class="modal wide"><h3>全局搜索：' + esc(kw) + "</h3>" +
      '<div id="g-result"><p class="empty">正在 ' + sites.length + " 个资源站中搜索...</p></div>" +
      '<footer><button class="btn ghost" id="g-close">关闭</button></footer></div></div>';
    $("#g-close").onclick = function () { $("#modal-root").innerHTML = ""; };
    var pending = sites.length, groups = [];
    sites.forEach(function (s) {
      api("/api/admin/site/search?id=" + encodeURIComponent(s.id) + "&wd=" + encodeURIComponent(kw))
        .then(function (r) { groups.push({ site: s, list: (r.data || {}).results || [], count: (r.data || {}).count || 0 }); })
        .catch(function () { groups.push({ site: s, list: [], count: 0, err: true }); })
        .then(function () { if (--pending === 0) renderGlobal(groups, kw); });
    });
  }
  function renderGlobal(groups, kw) {
    var box = $("#g-result"); if (!box) return;
    var total = groups.reduce(function (a, g) { return a + g.list.length; }, 0);
    if (!total) { box.innerHTML = '<p class="empty">各资源站均未搜索到「' + esc(kw) + "」。</p>"; return; }
    var h = ['<p class="empty">共命中 ' + total + " 条，点「详情」查看剧集并播放：</p>"];
    groups.sort(function (a, b) { return b.list.length - a.list.length; }).forEach(function (g) {
      h.push('<h4 style="margin:14px 0 6px;font-size:13px">' + esc(g.site.name) +
        ' <span class="pill ' + (g.err ? "off" : "on") + '">' + (g.err ? "请求失败" : g.list.length + " 条") + "</span></h4>");
      if (!g.list.length) { h.push('<p class="empty">无结果</p>'); return; }
      h.push("<table><thead><tr><th>标题</th><th>分类</th><th>备注</th><th>资源ID</th><th>操作</th></tr></thead><tbody>");
      g.list.slice(0, 20).forEach(function (x) {
        h.push("<tr><td>" + esc(x.title) + "</td><td>" + esc(x.type) + "</td><td>" + esc(x.remark) +
          "</td><td><code class='mono'>" + esc(x.resource_id) + "</code></td>" +
          "<td><button class='btn ghost sm' data-gsite='" + esc(g.site.id) + "' data-rid='" + esc(x.resource_id) + "'>详情</button></td></tr>");
      });
      h.push("</tbody></table>");
    });
    box.innerHTML = h.join("");
    box.querySelectorAll("button[data-rid]").forEach(function (b) {
      b.addEventListener("click", function () { openDetailModal(siteById(b.dataset.gsite), b.dataset.rid, kw); });
    });
  }

  // 详情：查看单部资源的剧集列表，可内嵌播放（直连 m3u8）/ 新窗口播放 / 复制地址

        '<video id="d-video" controls playsinline preload="metadata"></video>' +

      "</div>" +
      '<div id="d-body"><p class="empty">加载中...</p></div>' +
      '<footer><button class="btn ghost" id="d-back">返回搜索</button><button class="btn ghost" id="d-close">关闭</button></footer></div></div>';
    $("#d-close").onclick = function () { stopPlay(); $("#modal-root").innerHTML = ""; };
    $("#d-back").onclick = function () { stopPlay(); openSearchModal(site, backWd); };

    api("/api/admin/site/detail?id=" + encodeURIComponent(site.id) + "&rid=" + encodeURIComponent(rid))

        var d = r.data || {}, v = d.detail || {}, eps = d.episodes || [];
        var h = ['<div class="kv" style="margin-bottom:6px">',
          "<div><b>剧名</b>" + esc(v.title) + "</div>",
          "<div><b>分类</b>" + esc(v.type || "-") + "</div>",
          "<div><b>备注</b>" + esc(v.remark || "-") + "</div>",
          "<div><b>资源ID</b>" + esc(v.resource_id) + "</div>",
          "<div><b>播放源</b>" + esc(v.play_from || "-") + "</div>",
          "</div>"];
        if (!eps.length) {
          h.push('<p class="empty">未解析到剧集播放地址，请检查该资源站的详情地址模板。</p>');
          box.innerHTML = h.join("");
          return;
        }
        h.push('<p class="empty">共 ' + esc(eps.length) + " 集：点「内嵌播放」在本页直接看，或「新窗口」打开播放页、「复制」取地址。</p>");
        h.push("<table><thead><tr><th>集数</th><th>播放地址</th><th>操作</th></tr></thead><tbody>");
        eps.slice(0, 300).forEach(function (e) {

              '<a class="btn ghost sm" href="' + esc(e.url) + '" target="_blank" rel="noopener noreferrer">新窗口</a>' +
              "<button class='btn ghost sm' data-copy='" + esc(e.url) + "'>复制</button>" +
            "</div></td></tr>");
        });
        h.push("</tbody></table>");
        box.innerHTML = h.join("");
        box.querySelectorAll("button[data-copy]").forEach(function (b) {
          b.addEventListener("click", function () { copyText(b.dataset.copy); });
        });
        box.querySelectorAll("button[data-play]").forEach(function (b) {
          b.addEventListener("click", function () { playInline(b.dataset.play, b.dataset.ep, true); });
        });
        // 打开详情即预解析第 1 集，播放器就绪，点 ▶ 即可看
        playInline(eps[0].url, eps[0].episode, false);
      })
      .catch(function (e) { $("#d-body").innerHTML = '<p class="err">' + esc(e.message) + "</p>"; });
  }

  // ===== 内嵌播放：播放页 → 直链 m3u8 → hls.js 播放 =====
  var hlsInstance = null;
  function destroyHls() {
    if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
  }
  function stopPlay() {
    destroyHls();
    var v = $("#d-video");
    if (v) { try { v.pause(); } catch (e) {} v.removeAttribute("src"); v.load(); }
  }
  function loadHls(cb) {
    if (window.Hls) { cb(); return; }
    var s = document.getElementById("hls-lib");
    if (!s) {
      s = document.createElement("script");
      s.id = "hls-lib"; s.src = BASE + "/assets/hls.js";
      document.head.appendChild(s);
    }
    if (s.dataset.ready === "1") { cb(); return; }
    s.addEventListener("load", function () { s.dataset.ready = "1"; cb(); });
    s.addEventListener("error", function () { cb("hls.js 加载失败"); });
  }
  // pageUrl 播放页地址；label 集数；autoplay 是否自动播放（用户点击时才自动播放）
  function playInline(pageUrl, label, autoplay) {
    var box = $("#d-player");
    if (!box) return;
    box.classList.remove("hide");
    $("#d-pinfo").textContent = "解析播放地址中…（" + label + "）";
    api("/api/admin/stream?page=" + encodeURIComponent(pageUrl)).then(function (r) {
      if (!$("#d-video")) return; // 弹窗已关闭
      var info = $("#d-pinfo");
      if (r.code !== 200) {
        info.textContent = (r.msg || "解析失败").replace("解析播放地址失败: ", "") + "（可点「新窗口」）";
        return;
      }
      var url = (r.data || {}).stream;
      var open = $("#d-open");
      open.href = pageUrl; open.classList.remove("hide");
      attachStream(url, label, autoplay);
    }).catch(function (e) {
      if ($("#d-pinfo")) $("#d-pinfo").textContent = "解析失败：" + (e.message || "网络错误");
    });
  }
  function attachStream(url, label, autoplay) {
    var v = $("#d-video"), info = $("#d-pinfo");
    if (!v) return;
    destroyHls();
    var say = function (t) { if (info) info.textContent = t; };
    var play = function () {
      if (!autoplay) { say("已就绪：" + label + "，点 ▶ 播放"); return; }
      say("正在播放：" + label);
      var p = v.play(); if (p && p.catch) p.catch(function () { say("已就绪：" + label + "，点 ▶ 播放"); });
    };
    if (v.canPlayType("application/vnd.apple.mpegurl") && !window.Hls) {
      // Safari 原生支持 HLS
      v.src = url; play();
      return;
    }
    loadHls(function (err) {
      if (!$("#d-video")) return;
      if (err || !window.Hls || !window.Hls.isSupported()) {
        // 兜底：直接交给 video 标签，能不能播由浏览器决定
        v.src = url;
        if (v.canPlayType("application/vnd.apple.mpegurl")) { play(); }
        else { say("当前浏览器不支持内嵌播放（" + (err || "无 HLS 支持") + "），请用「新窗口」"); }
        return;
      }
      hlsInstance = new window.Hls({ enableWorker: true });
      hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, play);
      hlsInstance.on(window.Hls.Events.ERROR, function (evt, data) {
        if (data && data.fatal) say("播放出错（" + data.details + "），可点「新窗口」");
      });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(v);
    });
  }

  // 复制到剪贴板（HTTPS 用 clipboard API，HTTP 环境回退 execCommand）
  function copyText(txt) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("已复制"); }
      catch (err) { toast("复制失败，请手动复制"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(function () { toast("已复制"); }, fallback);
      return;
    }
    fallback();
  }

  // 同步：重新拉取分类列表并写回 CID
  function openSyncModal(site) {
    $("#modal-root").innerHTML =
      '<div class="mask"><div class="modal"><h3>同步资源站：' + esc(site.name) + "</h3>" +
      '<p class="empty">重新拉取该资源站的最新分类列表，并写回分类 CID（不会修改搜索地址 / 详情地址）。</p>' +
      '<footer><button class="btn ghost" id="y-close">取消</button><button class="btn primary" id="y-go">开始同步</button></footer>' +
      '<div id="y-result" style="margin-top:16px"></div></div></div>';
    $("#y-close").onclick = function () { $("#modal-root").innerHTML = ""; };
    $("#y-go").onclick = function () {
      $("#y-result").innerHTML = '<p class="empty">同步中...</p>';
      api("/api/admin/site/sync?id=" + encodeURIComponent(site.id), { method: "POST" })
        .then(function (r) {
          if (r.code !== 200) { $("#y-result").innerHTML = '<p class="err">' + esc(r.msg) + "</p>"; return; }
          var d = r.data || {}, cids = d.cids || [];
          $("#y-result").innerHTML = '<p class="empty">同步完成，共 ' + esc(d.count) + " 个分类，CID 已写回。</p>" +
            "<textarea rows='7' readonly>" + esc(cids.map(function (v) { return v.id + " " + v.name; }).join("\n")) + "</textarea>";
          loadSites();
        })
        .catch(function (e) { $("#y-result").innerHTML = '<p class="err">' + esc(e.message) + "</p>"; });
    };
  }

  // 苹果CMS 自动分析
  function openAutoModal() {
    $("#modal-root").innerHTML =
      '<div class="mask"><div class="modal"><h3>苹果CMS 自动分析</h3>' +
      '<div class="field"><label>接口地址（api.php/provide/vod）</label><input id="a-url" placeholder="http://xxx/api.php/provide/vod"></div>' +
      '<div class="field"><label>资源站名称（留空自动命名）</label><input id="a-name"></div>' +
      '<footer><button class="btn ghost" id="a-cancel">取消</button><button class="btn primary" id="a-go">开始分析</button></footer>' +
      '<div id="a-result" style="margin-top:16px"></div>' +
      "</div></div>";
    $("#a-cancel").onclick = function () { $("#modal-root").innerHTML = ""; };
    $("#a-go").onclick = function () {
      var url = $("#a-url").value.trim();
      if (!url) { toast("请输入接口地址"); return; }
      $("#a-result").innerHTML = "分析中...";
      api("/api/admin/site/auto", { method: "POST", body: { url: url, name: $("#a-name").value.trim() } })
        .then(function (r) {
          if (r.code !== 200) { $("#a-result").innerHTML = '<p class="err">' + esc(r.msg) + "</p>"; return; }
          var d = r.data || {}, s = d.site || {}, cids = d.cids || [];
          $("#a-result").innerHTML =
            "<p class='empty'>识别到资源站：<b>" + esc(s.name) + "</b>，分类 " + cids.length + " 个</p>" +
            "<textarea rows='6' readonly>" + esc(JSON.stringify(cids, null, 2)) + "</textarea>" +
            '<div style="margin-top:12px"><button class="btn primary" id="a-save">保存为资源站</button></div>';
          $("#a-save").onclick = function () {
            api("/api/admin/site", { method: "POST", body: {
              name: s.name, type: s.type || "applecms", url: s.url, detail_url: s.detail_url,
              encode: s.encode || "utf8", cid: s.cid || "", enabled: true
            }}).then(function (rr) {
              toast(rr.code === 200 ? "已保存" : (rr.msg || "失败"));
              if (rr.code === 200) { $("#modal-root").innerHTML = ""; loadSites(); }
            });
          };
        })
        .catch(function (e) { $("#a-result").innerHTML = '<p class="err">' + esc(e.message) + "</p>"; });
    };
  }
  $("#btn-auto").onclick = openAutoModal;
  $("#q-auto").onclick = openAutoModal;

  // 首页「搜索资源」：有站点则打开首个启用站点的搜索弹窗
  $("#q-search").onclick = function () {
    var s = allSites.filter(function (x) { return x.enabled; })[0] || allSites[0];
    if (!s) { toast("暂无资源站，请先新增"); return; }
    openSearchModal(s);
  };

  // ===== 映射 =====
  function loadMaps() {
    api("/api/admin/mappings").then(function (r) {
      var d = r.data || {};
      allMaps = d.mappings || [];
      renderMaps(allMaps, d.sites || []); renderHome();
    }).catch(function (e) { $("#maps-box").innerHTML = '<p class="empty">加载失败：' + esc(e.message) + "</p>"; });
  }
  function renderMaps(maps, sites) {
    if (!maps.length) { $("#maps-box").innerHTML = '<p class="empty">暂无映射。</p>'; return; }
    var h = [];
    maps.forEach(function (m, idx) {
      var checks = sites.map(function (s) {
        var on = (m.sites || []).indexOf(s.id) >= 0;
        return '<label><input type="checkbox" data-map="' + idx + '" value="' + esc(s.id) + '"' + (on ? " checked" : "") + ">" + esc(s.name) + ' <code class="mono">' + esc(s.id) + "</code></label>";
      }).join("");
      h.push('<div class="maprow"><div class="off">' + esc(m.official) + "</div>" +
        '<div class="checks">' + (checks || '<span class="empty">请先添加资源站</span>') + "</div>" +
        '<button class="btn primary sm" data-savemap="' + idx + '" data-official="' + esc(m.official) + '">保存</button></div>');
    });
    $("#maps-box").innerHTML = h.join("");
    $("#maps-box").querySelectorAll("button[data-savemap]").forEach(function (btn) {
      btn.onclick = function () {
        var idx = btn.dataset.savemap;
        var ids = Array.prototype.filter.call(
          $("#maps-box").querySelectorAll('input[data-map="' + idx + '"]'),
          function (c) { return c.checked; }
        ).map(function (c) { return c.value; });
        api("/api/admin/mapping", { method: "POST", body: { site: btn.dataset.official, sites: ids } })
          .then(function (r) { toast(r.code === 200 ? "映射已保存" : (r.msg || "失败")); });
      };
    });
  }
  $("#btn-refresh-maps").onclick = loadMaps;

  // ===== 系统 =====
  // 检查远程版本（只查不更）：填充「远程版本」并给出提示
  function checkUpdate(manual) {
    if (manual) $("#update-msg").textContent = "正在检查远程版本...";
    api("/api/admin/update/check").then(function (r) {
      var d = r.data || {};
      verData.remote_checked = true;
      verData.remote_error = d.error || "";
      if (d.error) remoteVer = "检查失败";
      else if (d.has_update) remoteVer = "v" + d.latest + "（有新版本）";
      else remoteVer = "v" + d.latest + "（已是最新）";
      renderSys();
      $("#update-msg").textContent = r.msg || "";
      if (manual) toast(r.msg || "检查完成");
    }).catch(function (e) {
      verData.remote_checked = true;
      verData.remote_error = e.message || "网络错误";
      remoteVer = "检查失败";
      renderSys();
      $("#update-msg").textContent = "检查失败：" + (e.message || "网络错误");
    });
  }
  $("#btn-check").onclick = function () { checkUpdate(true); };
  $("#q-check").onclick = function () { switchTab("sys"); checkUpdate(true); };
  function reloadConf() {
    api("/api/admin/reload", { method: "POST" })
      .then(function (r) { toast(r.code === 200 ? "配置已重载" : (r.msg || "失败")); loadSites(); loadMaps(); });
  }
  $("#btn-reload").onclick = reloadConf;
  $("#q-reload").onclick = reloadConf;
  $("#btn-update").onclick = function () {
    $("#update-msg").textContent = "正在更新...（下载 → 替换 → 重启，约 20-40 秒）";
    api("/api/update", { method: "POST" })
      .then(function (r) { $("#update-msg").textContent = r.msg || ""; toast(r.msg || "完成"); })
      .catch(function (e) {
        // 更新成功后服务会自重启，连接可能被掐断
        $("#update-msg").textContent = "已触发更新（服务正在重启，约 20-40 秒后刷新页面查看）：" + (e.message || "");
      });
  };

  checkAuth();
})();
</script>
