<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    color: #333;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; padding: 40px 20px; }
  .code {
    font-size: 120px;
    font-weight: 700;
    color: #1a73e8;
    line-height: 1;
    letter-spacing: -4px;
  }
  .msg { font-size: 20px; margin-top: 16px; color: #5f6368; }
  .sub { font-size: 14px; margin-top: 10px; color: #9aa0a6; }
  a { color: #1a73e8; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">抱歉，您访问的页面未找到</div>
    <div class="sub">请检查网址是否正确，或 <a href="/">返回首页</a></div>
  </div>
</body>
</html>
